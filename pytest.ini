[pytest]
pythonpath = .
testpaths = tests
# Los logs se guardan y se muestran si una prueba falla. Para verlos en
# vivo: python -m pytest -o log_cli=true
log_level = INFO
log_format = %(asctime)s.%(msecs)03d %(levelname)-7s %(name)s.%(funcName)s() | %(message)s
log_date_format = %H:%M:%S
log_cli_level = INFO
