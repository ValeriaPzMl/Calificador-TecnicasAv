# Migraciones de la BD (Supabase/Postgres). Uso, desde Calificador/:
#     alembic upgrade head      crea o actualiza las tablas
#     alembic current           en qué versión está la BD
# La URL de la BD sale de DATABASE_URL (.env), no de este archivo.

[alembic]
script_location = %(here)s/storage/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
